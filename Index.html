<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Little Blossoms Homework</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box}
body{
 margin:0;font-family:Arial,Helvetica,sans-serif;color:#27324a;min-height:100vh;
 background:
 radial-gradient(circle at 12% 12%,rgba(255,190,220,.75) 0 8%,transparent 23%),
 radial-gradient(circle at 88% 14%,rgba(170,225,255,.8) 0 9%,transparent 25%),
 radial-gradient(circle at 80% 88%,rgba(214,193,255,.72) 0 8%,transparent 24%),
 linear-gradient(135deg,#fff5fb 0%,#eaf8ff 48%,#f5efff 100%);
 background-attachment:fixed;
 position:relative;
}
body:before{
 content:"☁︎     ✦     ☁︎        🌸        ✦     ☁︎";
 position:fixed;top:18px;left:0;width:100%;text-align:center;
 font-size:26px;letter-spacing:12px;color:rgba(255,255,255,.82);
 text-shadow:0 2px 15px rgba(110,120,170,.18);pointer-events:none;z-index:0
}
.wrap{max-width:920px;margin:auto;padding:18px;position:relative;z-index:1}
.panel{
 background:rgba(255,255,255,.52);border:1px solid rgba(255,255,255,.82);
 border-radius:26px;padding:21px;margin-bottom:18px;
 box-shadow:0 18px 55px rgba(72,85,130,.14);
 backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)
}
h1{margin:0;color:#4b5fc2;font-size:27px;letter-spacing:.2px}
.muted{color:#69748e;font-size:13px;margin-top:6px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
label{font-size:13px;font-weight:800;display:block;margin:0 0 6px}
input,select,textarea{
 width:100%;padding:12px 13px;border:1px solid rgba(140,150,180,.25);
 border-radius:13px;background:rgba(255,255,255,.72);font-size:14px;
 color:#27324a;outline:none;box-shadow:inset 0 1px 3px rgba(60,70,100,.04)
}
textarea{min-height:78px;resize:vertical}
.subject{
 border:1px solid rgba(145,155,190,.22);border-radius:19px;padding:15px;
 margin-top:14px;background:rgba(255,255,255,.48);
 box-shadow:0 8px 24px rgba(70,80,120,.06)
}
.subhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.subhead b{font-size:16px;color:#4b5fc2}
.cw{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.box{
 background:rgba(255,255,255,.62);border-radius:16px;padding:14px;
 border:1px solid rgba(255,255,255,.9);box-shadow:0 6px 18px rgba(80,90,130,.05)
}
.box h4{margin:0 0 10px;color:#56627d}
.buttons{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
button{border:0;border-radius:13px;padding:11px 16px;font-weight:800;cursor:pointer}
.primary{background:linear-gradient(135deg,#5368cf,#8a73c8);color:white;box-shadow:0 7px 18px rgba(83,104,207,.24)}
.secondary{background:rgba(238,241,255,.9);color:#4658b4}
.danger{background:rgba(255,235,239,.95);color:#c13b4b}
.preview{display:none}
.card{
 width:720px;max-width:100%;margin:auto;border-radius:30px;overflow:hidden;
 background:rgba(255,255,255,.57);
 border:1px solid rgba(255,255,255,.92);
 box-shadow:0 22px 65px rgba(67,78,125,.24);
 backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
 position:relative
}
.card:before{
 content:"";position:absolute;inset:0;pointer-events:none;
 background:
 radial-gradient(circle at 94% 88%,rgba(255,226,155,.32) 0 40px,transparent 41px),
 radial-gradient(circle at 4% 70%,rgba(208,188,255,.3) 0 34px,transparent 35px),
 radial-gradient(circle at 92% 11%,rgba(173,231,255,.3) 0 30px,transparent 31px)
}
.top{
 background:linear-gradient(135deg,rgba(93,111,207,.9),rgba(139,119,201,.88),rgba(80,160,195,.88));
 color:#fff;text-align:center;padding:29px 20px;position:relative
}
.top:before{content:"☁  ✦  ☁";display:block;font-size:18px;opacity:.85;margin-bottom:6px}
.brand{font-size:29px;font-weight:900;letter-spacing:1px;text-shadow:0 2px 8px rgba(40,50,100,.18)}
.tag{font-size:11px;letter-spacing:2.4px;margin-top:6px}
.info{
 display:flex;justify-content:space-between;padding:14px 22px;
 background:rgba(242,245,255,.7);font-weight:800;font-size:14px;
 border-bottom:1px solid rgba(255,255,255,.75)
}
.cardbody{padding:20px;position:relative}
.daily{
 background:rgba(255,248,217,.58);border:1px solid rgba(238,222,170,.6);
 border-radius:18px;padding:15px;margin-bottom:15px;
 box-shadow:0 7px 20px rgba(120,100,50,.06)
}
.daily h3{margin:0 0 8px;color:#80639c;font-size:16px}
.dailytext{font-size:14px;line-height:1.72;white-space:pre-line}
.subcard{
 background:rgba(255,255,255,.54);border:1px solid rgba(255,255,255,.85);
 border-radius:18px;overflow:hidden;margin-bottom:14px;
 box-shadow:0 6px 20px rgba(70,80,120,.06)
}
.subcard h3{margin:0;padding:12px 15px;background:rgba(241,244,255,.68);color:#4b5fc2;font-size:16px}
.sec{padding:12px 15px;border-top:1px solid rgba(220,225,238,.65);font-size:14px;line-height:1.6}
.sec b{font-size:12px;color:#65708a;letter-spacing:.3px}
.footer{text-align:center;color:#707b94;font-size:13px;font-weight:800;padding:3px 20px 24px;position:relative}
.star{letter-spacing:5px;color:#aeb8d8;font-size:13px}
@media(max-width:760px){.grid,.cw{grid-template-columns:1fr}.info{flex-direction:column;gap:7px}.wrap{padding:10px}.brand{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">
<div class="panel"><h1>🌸 Little Blossoms Homework</h1><div class="muted">Premium Daily Homework & Activity Card</div></div>
<div class="panel">
<div class="grid">
<div><label>📅 Date</label><input id="date" type="date"></div>
<div><label>👧 Class</label><input id="className" placeholder="e.g. Nursery"></div>
<div><label>🧒 Student Name <span style="font-weight:500;color:#7b849a">(Optional)</span></label><input id="studentName" placeholder="e.g. Adhira"></div>
</div>
<div style="margin-top:15px"><label>🌈 Daily Activities</label><textarea id="daily" placeholder="Prayer, Rhymes, Story Time, Colouring, Outdoor Play..."></textarea></div>
<div id="subjects"></div>
<div class="buttons"><button class="secondary" onclick="addSubject()">＋ Add Subject</button><button class="primary" onclick="generate()">✨ Generate Card</button><button class="secondary" onclick="clearAll()">Clear</button></div>
</div>
<div class="panel preview" id="preview">
<div class="card" id="card">
<div class="top"><div class="brand">🌸 LITTLE BLOSSOMS 🌸</div><div class="tag">DAILY LEARNING & HOMEWORK</div></div>
<div class="info">
<span>📅 <span id="oDate"></span></span>
<span id="studentInfo" style="display:none">🧒 <span id="oStudent"></span></span>
<span>👧 CLASS: <span id="oClass"></span></span>
</div>
<div class="cardbody"><div class="daily" id="oDailyBox"><h3>🌈 DAILY ACTIVITIES</h3><div class="dailytext" id="oDaily"></div></div><div id="oSubjects"></div></div>
<div class="footer"><div class="star">✦ 🌸 ★ 🌼 ✦</div><br>✨ Learn • Play • Grow ✨<br>Little Blossoms</div>
</div>
<div class="buttons" style="justify-content:center"><button class="primary" onclick="saveImage()">⬇ Save as Image</button><button class="secondary" onclick="window.print()">🖨 Print</button></div>
</div>
</div>
<script>
let count=0;
function addSubject(){
 count++;let id=count;
 let d=document.createElement('div');d.className='subject';d.id='s'+id;
 d.innerHTML=`<div class="subhead"><b>📚 Subject ${id}</b><button class="danger" onclick="document.getElementById('s${id}').remove()">Remove</button></div>
 <label>Subject Name</label><input class="name" placeholder="English / Maths / Hindi / Activity">
 <div class="cw">
 <div class="box"><h4>📖 CLASSWORK (CW)</h4><label>Type</label><select class="cwtype"><option>Copy</option><option>Book</option></select><label style="margin-top:8px">Copy / Book Name</label><input class="cwbook" placeholder="English Writing Copy"><label style="margin-top:8px">Page</label><input class="cwpage" placeholder="12"><label style="margin-top:8px">Work / Activity</label><textarea class="cwwork" placeholder="What was done in class?"></textarea></div>
 <div class="box"><h4>🏠 HOMEWORK (HW)</h4><label>Type</label><select class="hwtype"><option>Copy</option><option>Book</option></select><label style="margin-top:8px">Copy / Book Name</label><input class="hwbook" placeholder="ABC Book"><label style="margin-top:8px">Page</label><input class="hwpage" placeholder="25"><label style="margin-top:8px">Work / Activity</label><textarea class="hwwork" placeholder="What should be done at home?"></textarea></div></div>`;
 document.getElementById('subjects').appendChild(d);
}
function v(x){return x?.value.trim()||''}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function generate(){
 let date=v(document.getElementById('date')),cls=v(document.getElementById('className'));
 if(!date||!cls){alert('Please enter Date and Class.');return}
 document.getElementById('oDate').textContent=new Date(date+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'long',year:'numeric'});
 document.getElementById('oClass').textContent=cls;
 const student=v(document.getElementById('studentName'));
 document.getElementById('studentInfo').style.display=student?'inline':'none';
 document.getElementById('oStudent').textContent=student;
 let daily=v(document.getElementById('daily'));document.getElementById('oDailyBox').style.display=daily?'block':'none';
 document.getElementById('oDaily').textContent=daily.split(/[,\n]+/).filter(x=>x.trim()).map(x=>'• '+x.trim()).join('\n');
 let out='';
 document.querySelectorAll('.subject').forEach(s=>{
  let n=v(s.querySelector('.name')),ct=v(s.querySelector('.cwtype')),cb=v(s.querySelector('.cwbook')),cp=v(s.querySelector('.cwpage')),cw=v(s.querySelector('.cwwork')),ht=v(s.querySelector('.hwtype')),hb=v(s.querySelector('.hwbook')),hp=v(s.querySelector('.hwpage')),hw=v(s.querySelector('.hwwork'));
  if(!n&&!cb&&!cw&&!hb&&!hw)return;
  out+=`<div class="subcard"><h3>📖 ${esc(n||'Learning Activity')}</h3>`;
  if(cb||cp||cw)out+=`<div class="sec"><b>📚 CLASSWORK</b><br>${cb?esc(ct)+': '+esc(cb)+'<br>':''}${cp?'Page: '+esc(cp)+'<br>':''}${cw?esc(cw):''}</div>`;
  if(hb||hp||hw)out+=`<div class="sec"><b>🏠 HOMEWORK</b><br>${hb?esc(ht)+': '+esc(hb)+'<br>':''}${hp?'Page: '+esc(hp)+'<br>':''}${hw?esc(hw):''}</div>`;
  out+='</div>';
 });
 if(!out){alert('Please add at least one subject/activity.');return}
 document.getElementById('oSubjects').innerHTML=out;document.getElementById('preview').style.display='block';document.getElementById('preview').scrollIntoView({behavior:'smooth'});
}
async function saveImage(){
 let canvas=await html2canvas(document.getElementById('card'),{scale:2,backgroundColor:'#fff',useCORS:true});
 let a=document.createElement('a');a.download='Little-Blossoms-Homework.png';a.href=canvas.toDataURL('image/png');a.click();
}
function clearAll(){if(!confirm('Clear all details?'))return;document.getElementById('subjects').innerHTML='';document.getElementById('daily').value='';document.getElementById('className').value='';document.getElementById('preview').style.display='none';count=0;addSubject()}
document.getElementById('date').value=new Date().toISOString().slice(0,10);addSubject();
</script>
</body></html>
